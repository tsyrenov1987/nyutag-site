<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нютаг</title>
<meta name="description" content="Нютаг — мессенджер для своих. Вход по приглашению.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--brand:#1C6FB3;--gold:#D9A227;--bg:#F4F7FB;--card:#FFFFFF;--text:#14202B;--muted:#5B6B7A;--line:#DDE5EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151C;--card:#17212B;--text:#E8EEF4;--muted:#93A3B3;--line:#26333F}}
:root[data-theme="dark"]{--bg:#0E151C;--card:#17212B;--text:#E8EEF4;--muted:#93A3B3;--line:#26333F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:40px 16px 32px}
.logo{width:88px;height:88px;border-radius:22px;display:block;margin:0 auto 20px;box-shadow:0 6px 20px rgba(28,111,179,.25)}
h1{font-size:26px;line-height:1.25;text-align:center;margin:0 0 8px}
.lead{color:var(--muted);text-align:center;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;text-align:center}
.code{font:700 34px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;margin:0 0 14px;word-break:break-all}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font:600 16px/1.2 inherit;font-family:inherit;text-align:center;text-decoration:none;cursor:pointer}
.primary{background:var(--brand);color:#fff}
.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn+.btn{margin-top:10px}
ol{margin:0;padding-left:22px}
ol li+li{margin-top:10px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:20px 0 0}
.hidden{display:none}
</style>
</head>
<body>
<main>
<svg class="logo" role="img" aria-label="Нютаг" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect fill="#1C6FB3"/>
  <g transform="translate(512 512) scale(0.92) translate(-512 -512)">
<g fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round" stroke-linecap="round">
    <path d="M240 500 L512 384 L784 500"/>
    <path d="M240 500 A272 40 0 0 0 784 500"/>
    <path d="M240 500 L240 700"/>
    <path d="M784 500 L784 700"/>
    <path d="M784 700 A272 40 0 0 1 430 739 L350 806 L350 731 A272 40 0 0 1 240 700"/>
  </g>
  <g fill="#D9A227">
    <path d="M460 330 A52 52 0 0 0 564 330 A64 64 0 0 1 460 330 Z"/>
    <circle cx="512" cy="300" r="32"/>
    <path d="M486 266 C468 246 472 224 488 212 C492 228 500 234 500 222 C500 202 508 192 512 178 C516 192 524 202 524 222 C524 234 532 228 536 212 C552 224 556 246 538 266 Z"/>
  </g>
  </g>
</svg>
<h1>Нютаг</h1>
<p class="lead">Переписка и звонки для своих. Всё шифруется на ваших устройствах.</p>
<section class="card"><p style="margin:0;text-align:center">Вход только по приглашению. Если вам прислали ссылку с кодом, откройте её на телефоне.</p></section>
</main>
</body>
</html>
